name: integration-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  compile-tests:
    name: Compile tests (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Run compile tests
        run: bash scripts/run_compile_tests_duckdb.sh

  integration-tests:
    name: Integration tests (Snowflake)
    runs-on: ubuntu-latest
    # Only run on pushes to main; PRs use compile-only tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: compile-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Run integration tests
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: bash scripts/run_integration_tests_snowflake.sh
