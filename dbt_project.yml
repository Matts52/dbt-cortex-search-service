# dbt_cortex_search_service
#
# A dbt package that adds a `cortex_search_service` materialization for
# creating and managing Snowflake Cortex Search Services directly from dbt.

config-version: 2

name: 'dbt_cortex_search_service'
version: '1.0.0'
require-dbt-version: [">=1.5.0", "<3.0.0"]

macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
