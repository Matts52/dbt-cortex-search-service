version: 2

macros:
  - name: snowflake__create_or_replace_cortex_search_service
    description: >
      Orchestrates the CREATE OR REPLACE CORTEX SEARCH SERVICE statement for a
      model using the `cortex_search_service` materialization. Runs pre/post
      hooks and returns the target relation. Called internally by the
      materialization — not intended for direct use.

  - name: snowflake__get_create_cortex_search_service_sql
    description: >
      Produces the DDL string that creates a Cortex Search Service. Operates
      in two modes controlled by the `raw_ddl` model config:

      - Default mode (raw_ddl=false): the model body is the SELECT query for
        the AS (...) clause. Required configs are on_column, warehouse, and
        target_lag. Optional configs are attributes, embedding_model, and
        comment.

      - Raw DDL mode (raw_ddl=true): treats the model body as everything
        following `CREATE OR REPLACE CORTEX SEARCH SERVICE <name>` and passes
        it through verbatim to Snowflake. Guarantees forward compatibility with
        any future CREATE CORTEX SEARCH SERVICE syntax.
    arguments:
      - name: relation
        type: any
        description: The fully-qualified service name used in the DDL.
      - name: sql
        type: string
        description: The compiled body of the dbt model (SELECT query in default mode).

  - name: snowflake__get_drop_cortex_search_service_sql
    description: >
      Returns the `DROP CORTEX SEARCH SERVICE IF EXISTS` DDL string for the
      given relation.
    arguments:
      - name: relation
        type: any
        description: The search service relation to drop.

  - name: snowflake__get_cortex_search_service_rename_sql
    description: >
      Raises a compiler error because Cortex Search Services do not support
      RENAME via ALTER. To rename, recreate the service under a new model name
      and drop the old one manually.
    arguments:
      - name: relation
        type: any
        description: The search service relation to rename (operation not supported).
      - name: new_name
        type: any
        description: The intended new name (operation not supported).

  - name: cortex_search_service_quote_string
    description: >
      Wraps a value in single quotes for use as a SQL string literal, escaping
      any embedded single quotes by doubling them.
    arguments:
      - name: value
        type: string
        description: 'The value to quote. Example: "Product knowledge base"'

  - name: cortex_search_service_render_attributes
    description: >
      Renders the ATTRIBUTES clause value. Accepts either a list (joined with
      ', ') or a pre-formatted string (used as-is). Returns the rendered
      comma-separated column list suitable for use in `ATTRIBUTES = ...`.
    arguments:
      - name: attributes
        type: any
        description: >
          Attribute columns to filter on. Example as list: ['region', 'category'].
          Example as string: 'region, category'.
